name: PhiNeuBio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Validate delayed-memory report
        run: |
          python -m phineubio --train-sequences 4 --test-sequences 2 --sequence-length 16 --epochs 3 > experiment-report.json
          python -m json.tool experiment-report.json > /dev/null
      - name: Validate feedback report and dashboard contract
        run: |
          python -m phineubio.feedback --train-trials 100 --evaluation-trials 40 --neurons 12 --output dashboard/feedback-report.json
          python -m json.tool dashboard/feedback-report.json > /dev/null
          python -c "import json; d=json.load(open('dashboard/feedback-report.json')); assert d['schema_version']=='2.0'; assert len(d['trace'])==100; assert d['metrics']['after_accuracy'] >= d['metrics']['before_accuracy']"
      - name: Check dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/index.html').read_text(); Path('dashboard-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check dashboard-check.js
      - name: Validate repeated-seed memory benchmark
        run: |
          python -m phineubio.benchmarks --seed-count 2 --delays 1 3 --train-sequences 6 --test-sequences 3 --sequence-length 16 --burn-in 4 --neurons 8 --epochs 5 --json-output dashboard/benchmark-report.json --csv-output benchmark-results.csv
          python -m json.tool dashboard/benchmark-report.json > /dev/null
          python -c "import csv,json; d=json.load(open('dashboard/benchmark-report.json')); assert d['schema_version']=='3.0'; assert len(d['runs'])==4; assert len(list(csv.DictReader(open('benchmark-results.csv'))))==4"
      - name: Check benchmark dashboard JavaScript
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/benchmark.html').read_text(); Path('benchmark-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check benchmark-check.js
      - name: Validate Phase 4 robustness JSON and CSV
        run: |
          python -m phineubio.robustness --seed-count 2 --delays 1 3 --noise-levels 0 0.25 --train-sequences 6 --test-sequences 3 --sequence-length 16 --burn-in 4 --neurons 8 --epochs 5 --json-output dashboard/robustness-report.json --csv-output robustness-results.csv
          python -m json.tool dashboard/robustness-report.json > /dev/null
          python -c "import csv,json; d=json.load(open('dashboard/robustness-report.json')); assert d['schema_version']=='4.0'; assert len(d['runs'])==8; assert len(list(csv.DictReader(open('robustness-results.csv'))))==8"
      - name: Check robustness dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/robustness.html').read_text(); Path('robustness-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check robustness-check.js
      - name: Validate Phase 5 temporal JSON CSV and profiler
        run: |
          python -m phineubio.temporal --seed-count 1 --delays 1 2 --noise-levels 0 0.2 --train-sequences 3 --test-sequences 2 --sequence-length 12 --burn-in 3 --neurons 5 --epochs 3 --json-output dashboard/temporal-report.json --csv-output temporal-results.csv
          python -m json.tool dashboard/temporal-report.json > /dev/null
          python -c "import csv,json; d=json.load(open('dashboard/temporal-report.json')); assert d['schema_version']=='5.0'; assert len(d['runs'])==4; assert all(p['total_ns']>0 for r in d['runs'] for p in r['profiling'].values()); assert len(list(csv.DictReader(open('temporal-results.csv'))))==4"
      - name: Check temporal dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/temporal.html').read_text(); Path('temporal-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check temporal-check.js
      - name: Validate Phase 6 competition report
        run: |
          python -m phineubio.competition --seed-count 1 --delays 1 2 --noise-levels 0 --train-sequences 4 --test-sequences 3 --sequence-length 14 --burn-in 3 --neurons 4 --epochs 3 --json-output dashboard/competition-report.json --csv-output competition-results.csv
          python -m json.tool dashboard/competition-report.json > /dev/null
          python -c "import json,csv; d=json.load(open('dashboard/competition-report.json')); assert d['schema_version']=='6.0'; assert len(d['runs'])==2; assert all('trained_rnn' in r['metrics'] and len(r['trained_rnn']['training_loss_by_epoch'])==3 for r in d['runs']); assert len(list(csv.DictReader(open('competition-results.csv'))))==2"
      - name: Check competition dashboard JavaScript
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/competition.html').read_text(); Path('competition-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check competition-check.js
      - name: Validate Phase 7 GRU report and independent selection
        run: |
          python -m phineubio.validation --seed-count 1 --delays 1 --noise-levels 0 --train-sequences 3 --validation-sequences 2 --test-sequences 2 --sequence-length 10 --burn-in 3 --epochs 2 --parameter-budget 55 --json-output dashboard/validation-report.json --csv-output validation-results.csv
          python -m json.tool dashboard/validation-report.json > /dev/null
          python -c "import csv,json; d=json.load(open('dashboard/validation-report.json')); assert d['schema_version']=='7.0'; assert len(d['runs'])==1; assert all(r['selection'][m]['selected_learning_rate'] in d['configuration']['learning_rates'] for r in d['runs'] for m in ['trainable_gru','trainable_elman']); assert len(list(csv.DictReader(open('validation-results.csv'))))==1"
      - name: Check Phase 7 dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/validation.html').read_text(); Path('validation-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check validation-check.js
