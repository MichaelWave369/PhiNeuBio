name: PhiNeuBio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Validate delayed-memory report
        run: |
          python -m phineubio --train-sequences 4 --test-sequences 2 --sequence-length 16 --epochs 3 > experiment-report.json
          python -m json.tool experiment-report.json > /dev/null
      - name: Validate feedback report and dashboard contract
        run: |
          python -m phineubio.feedback --train-trials 100 --evaluation-trials 40 --neurons 12 --output dashboard/feedback-report.json
          python -m json.tool dashboard/feedback-report.json > /dev/null
          python -c "import json; d=json.load(open('dashboard/feedback-report.json')); assert d['schema_version']=='2.0'; assert len(d['trace'])==100; assert d['metrics']['after_accuracy'] >= d['metrics']['before_accuracy']"
      - name: Check dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/index.html').read_text(); Path('dashboard-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check dashboard-check.js
      - name: Validate repeated-seed memory benchmark
        run: |
          python -m phineubio.benchmarks --seed-count 2 --delays 1 3 --train-sequences 6 --test-sequences 3 --sequence-length 16 --burn-in 4 --neurons 8 --epochs 5 --json-output dashboard/benchmark-report.json --csv-output benchmark-results.csv
          python -m json.tool dashboard/benchmark-report.json > /dev/null
          python -c "import csv,json; d=json.load(open('dashboard/benchmark-report.json')); assert d['schema_version']=='3.0'; assert len(d['runs'])==4; assert len(list(csv.DictReader(open('benchmark-results.csv'))))==4"
      - name: Check benchmark dashboard JavaScript
        run: |
          python -c "from pathlib import Path; h=Path('dashboard/benchmark.html').read_text(); Path('benchmark-check.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check benchmark-check.js
